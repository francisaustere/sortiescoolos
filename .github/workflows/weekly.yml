name: Collecte hebdo + site

on:
  schedule:
    # Every Monday 04:17 UTC (~5-6h Paris), off the hour to avoid queue delays
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    paths-ignore:
      - "public/data/**"
      - "snapshots/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Outils OCR (agenda PDF du Vortex)
        if: github.event_name != 'push'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-fra
      # A code push only rebuilds the site; crawling runs on schedule or by hand (avoids data-commit conflicts)
      - name: Collecte des sources
        if: github.event_name != 'push'
        run: npm run crawl
      - name: Sauvegarde des données dans le dépôt
        if: github.event_name != 'push'
        run: |
          git config user.name "sorties-bot"
          git config user.email "sorties-bot@users.noreply.github.com"
          git add public/data/events.json && (git add snapshots 2>/dev/null || true)
          git diff --cached --quiet || (git commit -m "data: collecte du $(date -u +%F)" && git push)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: crawl-and-build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
